name: Build & Release (HideSelf Runtime)

# Три входа в одну сборку:
#   push тега      — ручной `git push --tags` от человека;
#   workflow_call  — из sync-upstream.yml, потому что тег, отправленный
#                    GITHUB_TOKEN, события `push` НЕ порождает, и такие релизы
#                    молча не собирались (v1.0.0-hs.18…20);
#   workflow_dispatch — отладочный прогон руками.
on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      version:
        description: "Release version tag (e.g. v1.0.0-hs.21)"
        required: true
        type: string
      ref:
        description: "Git ref to build; defaults to the ref that started the run"
        required: false
        type: string
      prerelease:
        description: "Publish as prerelease (not served via releases/latest)"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v1.0.0-hs.21)"
        required: true
        default: "v1.0.0-hs.local"
      prerelease:
        description: "Publish as prerelease (not served via releases/latest)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows-runtime:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Setup MSVC 14.40 toolset
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: 14.40

      - name: Install dependencies
        run: pip install .

      - name: Build PyInstaller bootloader from source
        run: pip install "pyinstaller==6.16.0" --no-binary pyinstaller
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: 1

      - name: Build HideSelf runtime EXE
        run: pyinstaller packaging/hideself-windows.spec --noconfirm

      - name: Normalize artifact name
        shell: pwsh
        run: Move-Item dist/hideself-tgws.exe dist/hideself-tgws_windows.exe -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: hideself-tgws-runtime
          path: dist/hideself-tgws_windows.exe

  release:
    needs: [build-windows-runtime]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/download-artifact@v8
        with:
          pattern: hideself-tgws-runtime
          path: dist
          merge-multiple: true

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.version || github.ref_name }}"
          {
            echo "# HideSelf TGWS Runtime ${TAG}"
            echo
            echo "Managed TG WS runtime artifact for HideSelf."
            echo
            if [ -f ".hideself/upstream-changelog.md" ]; then
              echo "## Changelog"
              echo
              cat .hideself/upstream-changelog.md
            else
              echo "## Changelog"
              echo
              echo "Changelog file not found in repository for this build."
            fi
          } > RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: "HideSelf TGWS Runtime ${{ inputs.version || github.ref_name }}"
          body_path: RELEASE_NOTES.md
          files: |
            dist/hideself-tgws_windows.exe
          draft: false
          prerelease: ${{ inputs.prerelease || false }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
